[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gipg"
version = "1.0.0"
description = "Computing pure Nash equilibria of generalized integer programming games"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gurobipy>=10.0",
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
notebooks = ["jupyter", "matplotlib", "openpyxl"]

[tool.setuptools.packages.find]
include = ["gipg*"]
